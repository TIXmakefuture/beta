<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MAKE FUTURE | 纯粹边界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;  /* 纯白背景 */
            font-family: 'Inter', 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            color: #11171f;
            line-height: 1.5;
        }

        /* Hero 区域 — 全屏高度，内容居中 */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        /* 高端文字渐变 — 天蓝到深蓝 */
        .glow-title {
            font-size: clamp(2.8rem, 8vw, 5rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #0a2b44, #1c6fb0, #0a4c7a);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 1rem;
        }

        .subtitle {
            font-size: clamp(0.75rem, 2.5vw, 0.9rem);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #2c6b9e;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .description {
            max-width: 560px;
            margin: 0 auto;
            font-size: 1rem;
            opacity: 0.65;
            font-weight: 400;
            color: #1f3b4c;
        }

        /* 底部栏 — 极简毛玻璃效果 + 微弱天蓝边缘 */
        .footer {
            text-align: center;
            padding: 2rem 0 1.8rem;
            border-top: 1px solid rgba(28, 111, 176, 0.2);
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
        }

        .btn-outline-light {
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(28, 111, 176, 0.5);
            color: #0a4c7a;
            padding: 0.6rem 1.8rem;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            backdrop-filter: blur(4px);
            margin-bottom: 1rem;
        }

        .btn-outline-light:hover {
            background: rgba(200, 225, 245, 0.8);
            border-color: #1c6fb0;
            box-shadow: 0 0 14px rgba(28, 111, 176, 0.25);
            transform: translateY(-1px);
        }

        .copyright {
            font-size: 0.7rem;
            color: #5e7e9c;
            letter-spacing: 1px;
            font-weight: 400;
        }

        @media (max-width: 700px) {
            .hero {
                padding: 1rem;
            }
            .description {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <!-- 主视觉区域 - 仅文字，无按钮 -->
    <section class="hero">
        <h1 class="glow-title">MAKE FUTURE</h1>
        <div class="subtitle">TRANSCEND THE EDGE</div>
        <div class="description">
            以纯粹语言重构边界 — 精准、秩序、未来感知。
        </div>
    </section>

    <!-- 底部跳转区 -->
    <div class="footer">
        <button class="btn-outline-light" id="visitBtn">↗ 访问官方主页</button>
        <div class="copyright">✦  BEYOND THE PROTOTYPE  |  FUTURE IS NOW  ✦</div>
    </div>

    <script>
        // 底部外链跳转 (新标签页打开 tixmakefuture.github.io)
        const visitBtn = document.getElementById('visitBtn');
        if (visitBtn) {
            visitBtn.addEventListener('click', (e) => {
                e.preventDefault();
                window.open('https://tixmakefuture.github.io', '_blank', 'noopener,noreferrer');
                visitBtn.style.transform = 'scale(0.96)';
                setTimeout(() => { if (visitBtn) visitBtn.style.transform = ''; }, 150);
            });
        }

        // 控制台小彩蛋 (低调雅致)
        console.log("%c✦ MAKE FUTURE | 纯白秩序 · 极简未来 ✦", "color: #1c6fb0; font-size: 11px; font-weight: 500;");
    </script>
</body>
</html>
