<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>提示 | 测试版暂无内容</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            font-family: 'Inter', 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            color: #11171f;
            line-height: 1.5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 卡片容器 — 毛玻璃效果 */
        .message-card {
            text-align: center;
            max-width: 480px;
            padding: 2.5rem 2rem;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            border: 1px solid rgba(28, 111, 176, 0.25);
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.05), 0 0 0 1px rgba(28, 111, 176, 0.1) inset;
            margin: 1rem;
        }

        /* 图标占位 */
        .placeholder-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            opacity: 0.7;
            filter: drop-shadow(0 2px 6px rgba(28,111,176,0.2));
        }

        h2 {
            font-size: 1.8rem;
            font-weight: 500;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, #0a2b44, #1c6fb0);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .message-text {
            font-size: 1rem;
            color: #3a5c7c;
            margin-bottom: 2rem;
            opacity: 0.75;
        }

        /* 毛玻璃按钮 */
        .btn-return {
            background: rgba(240, 248, 255, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(28, 111, 176, 0.4);
            color: #0a4c7a;
            padding: 0.75rem 2rem;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            text-transform: uppercase;
            box-shadow: 0 0 8px rgba(28, 111, 176, 0.15);
        }

        .btn-return:hover {
            background: rgba(220, 240, 255, 0.85);
            border-color: #1c6fb0;
            box-shadow: 0 0 16px rgba(28, 111, 176, 0.3);
            transform: translateY(-1px);
        }

        /* 底部小字装饰 */
        .footnote {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.7rem;
            color: #8aaec0;
            letter-spacing: 1px;
        }

        @media (max-width: 500px) {
            .message-card {
                padding: 2rem 1.5rem;
            }
            h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="message-card">
        <div class="placeholder-icon">🔧</div>
        <h2>暂无内容</h2>
        <div class="message-text">
            当前测试版尚未提供此模块<br>敬请期待后续更新
        </div>
        <button class="btn-return" id="homeBtn">← 返回</button>
    </div>
    <div class="footnote">✦ 测试环境 | MAKE FUTURE ✦</div>

    <script>
        const homeBtn = document.getElementById('homeBtn');
        if (homeBtn) {
            homeBtn.addEventListener('click', () => {
                window.location.href = ' tixmakefuture.github.io/home';  
                console.log("返回首页操作已触发");
            });
        }

        // 控制台彩蛋（低调）
        console.log("%c✦ 测试版占位页 | 纯白秩序 ✦", "color: #1c6fb0; font-size: 11px;");
    </script>
</body>
</html>
