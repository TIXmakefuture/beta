<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MAKE FUTURE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;  /* 纯白背景，干净极致 */
            font-family: 'Inter', 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            color: #11171f;
            line-height: 1.5;
            scroll-behavior: smooth;
        }

        /* 简洁容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* Hero 区域 — 全屏高度，内容居中 */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        /* 高端文字渐变 — 天蓝到深蓝，干净有力 */
        .glow-title {
            font-size: clamp(2.8rem, 8vw, 5rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #0a2b44, #1c6fb0, #0a4c7a);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 1rem;
        }

        .subtitle {
            font-size: clamp(0.75rem, 2.5vw, 0.9rem);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #2c6b9e;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .description {
            max-width: 560px;
            margin: 0 auto 2rem;
            font-size: 1rem;
            opacity: 0.65;
            font-weight: 400;
            color: #1f3b4c;
        }

        /* 毛玻璃按钮 — 极其微弱的边缘光晕，天蓝冷色调 */
        .btn-glass {
            background: rgba(240, 248, 255, 0.65);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(28, 111, 176, 0.35);
            color: #0a4c7a;
            padding: 0.85rem 2.2rem;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(28, 111, 176, 0.15), inset 0 0 6px rgba(28, 111, 176, 0.08);
        }

        .btn-glass:hover {
            background: rgba(220, 240, 255, 0.85);
            border-color: rgba(28, 111, 176, 0.7);
            box-shadow: 0 0 18px rgba(28, 111, 176, 0.3);
            transform: scale(1.01);
            letter-spacing: 0.12em;
            color: #02457a;
        }

        /* 底部栏 — 极简毛玻璃效果 + 微弱天蓝边缘 */
        .footer {
            text-align: center;
            padding: 2rem 0 1.8rem;
            border-top: 1px solid rgba(28, 111, 176, 0.2);
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
        }

        .btn-outline-light {
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(28, 111, 176, 0.5);
            color: #0a4c7a;
            padding: 0.6rem 1.8rem;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            backdrop-filter: blur(4px);
            margin-bottom: 1rem;
        }

        .btn-outline-light:hover {
            background: rgba(200, 225, 245, 0.8);
            border-color: #1c6fb0;
            box-shadow: 0 0 14px rgba(28, 111, 176, 0.25);
            transform: translateY(-1px);
        }

        .copyright {
            font-size: 0.7rem;
            color: #5e7e9c;
            letter-spacing: 1px;
            font-weight: 400;
        }

        /* 滚动鼠标指示器 — 轻盈淡蓝 */
        .scroll-mouse {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            opacity: 0.55;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .scroll-mouse:hover {
            opacity: 0.85;
        }
        .mouse-wheel {
            width: 26px;
            height: 40px;
            border: 1.5px solid #1c6fb0;
            border-radius: 20px;
            position: relative;
        }
        .mouse-wheel::after {
            content: '';
            width: 2px;
            height: 8px;
            background: #1c6fb0;
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
            animation: scrollAnim 1.5s infinite cubic-bezier(0.45, 0, 0.55, 1);
        }
        @keyframes scrollAnim {
            0% { opacity: 1; transform: translateX(-50%) translateY(0); }
            70% { opacity: 0.3; transform: translateX(-50%) translateY(12px); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .scroll-text {
            font-size: 0.6rem;
            letter-spacing: 2px;
            font-weight: 400;
            color: #2c6b9e;
        }

        /* 响应式微调 */
        @media (max-width: 700px) {
            .hero {
                padding: 1rem;
            }
            .description {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <!-- 主视觉区域 - 仅保留核心文字和按钮，无卡片 -->
    <section class="hero">
        <h1 class="glow-title">MAKE FUTURE</h1>
        <div class="subtitle">TRANSCEND THE EDGE</div>
        <div class="description">
            以纯粹语言重构边界
        </div>
        <button class="btn-glass" id="exploreBtn">探 索 未 知 →</button>
        <!-- 滚动提示鼠标（优雅保留） -->
        <div class="scroll-mouse" id="scrollHint">
            <div class="mouse-wheel"></div>
            <div class="scroll-text">滚动探索</div>
        </div>
    </section>

    <!-- 底部跳转区 - 仅保留外链按钮，无其他模块 -->
    <div class="footer">
        <button class="btn-outline-light" id="visitBtn">↗ 访问官方主页</button>
        <div class="copyright">✦  BEYOND THE PROTOTYPE  |  FUTURE IS NOW  ✦</div>
    </div>

    <script>
        // 点击主按钮 / 滚动鼠标：平滑滚动到底部（展示footer区域或简单交互）
        // 由于移除了卡片区域，这里将滚动定位到 footer 上方，展示完整页面结构
        const exploreBtn = document.getElementById('exploreBtn');
        const scrollHint = document.getElementById('scrollHint');
        const footerElement = document.querySelector('.footer');

        function scrollToFooter() {
            if (footerElement) {
                footerElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
            // 按钮视觉反馈
            if (exploreBtn) {
                exploreBtn.style.transform = 'scale(0.97)';
                setTimeout(() => { if (exploreBtn) exploreBtn.style.transform = ''; }, 180);
            }
        }

        if (exploreBtn) exploreBtn.addEventListener('click', scrollToFooter);
        if (scrollHint) scrollHint.addEventListener('click', scrollToFooter);

        // 底部外链跳转 (新标签页打开 tixmakefuture.github.io)
        const visitBtn = document.getElementById('visitBtn');
        if (visitBtn) {
            visitBtn.addEventListener('click', (e) => {
                e.preventDefault();
                window.open('https://tixmakefuture.github.io/home', '_blank', 'noopener,noreferrer');
                visitBtn.style.transform = 'scale(0.96)';
                setTimeout(() => { if (visitBtn) visitBtn.style.transform = ''; }, 150);
            });
        }

        // 控制台小彩蛋 (低调雅致)
        console.log("%c✦ MAKE FUTURE | 纯白秩序 · 极简未来 ✦", "color: #1c6fb0; font-size: 11px; font-weight: 500;");
    </script>
</body>
</html>
