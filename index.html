<!-- ========== 虚拟币系统 + 卡密修改余额（仅添加，不改动原界面） ========== -->
<script>
(function() {
    // 虚拟币存储
    let crystalCoin = localStorage.getItem('crystalCoin') ? parseInt(localStorage.getItem('crystalCoin')) : 0;
    
    // 在导航栏右侧添加虚拟币显示面板（不破坏原结构）
    function addCoinPanel() {
        let nav = document.querySelector('nav');
        if (!nav) return;
        // 检查是否已添加过
        if (document.getElementById('coinPanelWidget')) return;
        let coinPanel = document.createElement('div');
        coinPanel.id = 'coinPanelWidget';
        coinPanel.style.cssText = 'display:flex; align-items:center; gap:12px; background:rgba(0,0,0,0.4); padding:6px 16px; border-radius:40px; backdrop-filter:blur(8px);';
        coinPanel.innerHTML = `
            <span style="color:#facc15; font-weight:bold;">💎 晶核: <span id="crystalAmount">${crystalCoin}</span></span>
            <button id="dailySignBtn" style="background:#38bdf8; border:none; padding:4px 14px; border-radius:30px; font-weight:bold; cursor:pointer; color:#0f172a;">📅 签到</button>
        `;
        nav.appendChild(coinPanel);
    }
    
    // 更新显示
    function updateCoinDisplay() {
        let span = document.getElementById('crystalAmount');
        if (span) span.innerText = crystalCoin;
        localStorage.setItem('crystalCoin', crystalCoin);
    }
    
    // 修改晶核数量
    function modifyCrystal(amount) {
        let newAmount = crystalCoin + amount;
        if (newAmount < 0) newAmount = 0;
        crystalCoin = newAmount;
        updateCoinDisplay();
        return crystalCoin;
    }
    
    // 每日签到
    function dailySign() {
        let today = new Date().toDateString();
        let lastSign = localStorage.getItem('lastSignDate');
        if (lastSign === today) {
            alert('今天已经签到过了，明天再来吧！');
            return;
        }
        localStorage.setItem('lastSignDate', today);
        modifyCrystal(20);
        alert('签到成功！获得 20 晶核 💎');
    }
    
    // ===== 核心：修改原有卡密功能，让卡密可以调晶核数量 =====
    // 等待原页面加载完成后，劫持 checkCardPwd 函数
    let interval = setInterval(function() {
        if (typeof window.checkCardPwd === 'function') {
            clearInterval(interval);
            // 保存原函数
            let originalCheckCardPwd = window.checkCardPwd;
            // 重写
            window.checkCardPwd = function() {
                let val = document.getElementById("cardPwd").value.trim();
                let resBox = document.getElementById("unlockRes");
                
                // 如果是正确的原卡密
                if (val === "astracraftnb666") {
                    // 弹出输入框让用户输入要修改的晶核数量
                    let amount = prompt('✅ 卡密验证成功！\n请输入要修改的晶核数量：\n（正数增加，负数减少）');
                    if (amount !== null) {
                        let num = parseInt(amount);
                        if (!isNaN(num)) {
                            let newBal = modifyCrystal(num);
                            // 显示成功信息到原来的解锁结果区域
                            if (resBox) {
                                resBox.className = "unlock-result glass success-text";
                                resBox.innerHTML = `🎉 晶核修改成功！变动 ${num >= 0 ? '+' : ''}${num}，当前晶核: ${newBal}`;
                                resBox.style.display = "block";
                                setTimeout(() => { resBox.style.display = "none"; }, 3000);
                            } else {
                                alert(`晶核修改成功！当前: ${newBal}`);
                            }
                        } else {
                            alert('请输入有效的数字！');
                        }
                    }
                    return;
                }
                
                // 卡密错误时调用原函数（原函数会显示错误信息）
                if (originalCheckCardPwd) {
                    originalCheckCardPwd();
                }
            };
        }
    }, 100);
    
    // 页面加载完成后添加面板和绑定签到
    window.addEventListener('DOMContentLoaded', function() {
        addCoinPanel();
        updateCoinDisplay();
        let signBtn = document.getElementById('dailySignBtn');
        if (signBtn) signBtn.onclick = dailySign;
    });
})();
</script>
<!-- ========== 虚拟币系统结束 ========== -->
