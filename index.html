<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>版本选择</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 40%, #1e2a3a, #0a0f1a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
            padding: 1.5rem;
        }

        /* 毛玻璃主容器 */
        .glass-panel {
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 48px;
            border: 0.5px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255,255,255,0.1);
            padding: 2rem 1.5rem;
            transition: all 0.3s ease;
        }

        /* 标题区域 */
        .title {
            text-align: center;
            margin-bottom: 2rem;
        }
        .title h1 {
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #fff, #e0e7ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .title p {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.7);
            margin-top: 6px;
            font-weight: 400;
        }

        /* 版本选项列表 — 极致简洁 */
        .versions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .version-item {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 1rem 1.5rem;
            backdrop-filter: blur(4px);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: 0.5px solid rgba(255,255,255,0.15);
        }

        .version-item:active {
            transform: scale(0.98);
            background: rgba(255,255,255,0.2);
        }

        /* 内容布局：左侧文字 + 右侧箭头 */
        .item-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .version-name {
            font-size: 1.3rem;
            font-weight: 590;
            color: white;
            letter-spacing: -0.2px;
        }

        .version-sub {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.65);
            font-weight: 400;
        }

        .arrow {
            font-size: 28px;
            font-weight: 300;
            color: rgba(255,255,255,0.7);
            transition: transform 0.2s;
        }

        .version-item:hover .arrow {
            transform: translateX(4px);
        }

        /* 底部精致水印 */
        .footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            border-top: 0.5px solid rgba(255,255,255,0.15);
            padding-top: 1rem;
        }

        @media (max-width: 450px) {
            .glass-panel {
                padding: 1.8rem 1.2rem;
                border-radius: 40px;
            }
            .version-name {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="glass-panel">
        <div class="title">
            <h1>版本选择</h1>
            <p>选择你的版本</p>
        </div>

        <div class="versions">
            <!-- 正式版 -->
            <div class="version-item" onclick="window.location.href='https://tixmakefuture.github.io/actualuse/';">
                <div class="item-content">
                    <div class="info">
                        <span class="version-name">正式版</span>
                        <span class="version-sub">稳定 · 完整功能</span>
                    </div>
                    <span class="arrow">›</span>
                </div>
            </div>

            <!-- 测试版 -->
            <div class="version-item" onclick="window.location.href='https://tixmakefuture.github.io/beta/';">
                <div class="item-content">
                    <div class="info">
                        <span class="version-name">测试版</span>
                        <span class="version-sub">前沿 · 新锐体验</span>
                    </div>
                    <span class="arrow">›</span>
                </div>
            </div>
        </div>

        <div class="footer">
            轻触版本即刻切换
        </div>
    </div>

    <script>
        // 简单增加触感 (iOS 风格)
        if (window.navigator && window.navigator.vibrate) {
            document.querySelectorAll('.version-item').forEach(el => {
                el.addEventListener('click', () => {
                    window.navigator.vibrate?.(8);
                });
            });
        }
    </script>
</body>
</html>
